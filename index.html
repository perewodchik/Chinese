<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the page can reach under an iPad's rounded
         corners and a phone's home indicator; the safe-area insets in the
         stylesheet keep the content out of them. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hanzi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14191e" />
    <!-- installable: on the home screen it opens without the browser's bars -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <title>Hanzi Workshop</title>
    <meta name="description" content="Read Chinese from real texts at HSK 1–2: pinyin and the words you are learning marked, a few cards a day, lines said aloud and scored, characters copied out stroke by stroke." />
    <meta property="og:title" content="Hanzi Workshop" />
    <meta property="og:description" content="Read Chinese from real texts at HSK 1–2, twenty to thirty minutes a day." />
    <!-- The app itself is a learner's own pages behind a sign-in: not for a
         search engine. The front door is public/welcome.html. -->
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
